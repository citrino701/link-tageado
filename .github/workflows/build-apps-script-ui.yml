name: Build and deploy Link Tageado

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "package.json"
      - "vite.config.ts"
      - "vite.gas.config.ts"
      - "apps-script/**"
      - "functions/**"
      - ".github/workflows/build-apps-script-ui.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "package.json"
      - "vite.config.ts"
      - "vite.gas.config.ts"
      - "apps-script/**"
      - ".github/workflows/build-apps-script-ui.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Apps Script source and manifest
        run: |
          node --check --input-type=commonjs < apps-script/public/Code.gs
          node --check --input-type=commonjs < apps-script/admin/Code.gs
          node -e "JSON.parse(require('node:fs').readFileSync('apps-script/admin/appsscript.json', 'utf8'))"

      - name: Test campaign associations and tracking
        run: |
          node --import tsx --test src/utils/campaigns.test.ts
          node --import tsx --test src/utils/public-link.test.ts
          node --test apps-script/public/tracker.test.mjs apps-script/admin/admin-stats.test.mjs functions/_middleware.test.mjs

      - name: Build React assets for Apps Script
        run: npm run build:gas-ui

      - name: Verify browser bundle
        run: |
          node -e "const fs = require('node:fs'); const bundle = fs.readFileSync('docs/app/hub-app.js', 'utf8'); if (bundle.includes('process.env.NODE_ENV')) { console.error('React bundle still contains an unresolved Node environment reference.'); process.exit(1); }"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

