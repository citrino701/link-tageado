name: Build Apps Script UI assets

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "vite.gas.config.ts"
      - "apps-script/**"
      - ".github/workflows/build-apps-script-ui.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "vite.gas.config.ts"
      - "apps-script/**"
      - ".github/workflows/build-apps-script-ui.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Apps Script source and manifest
        run: |
          node --check --input-type=commonjs < apps-script/public/Code.gs
          node --check --input-type=commonjs < apps-script/admin/Code.gs
          node -e "JSON.parse(require('node:fs').readFileSync('apps-script/admin/appsscript.json', 'utf8'))"


      - name: Build React assets for Apps Script
        run: npm run build:gas-ui

      - name: Publish generated assets to Pages source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app/hub-app.js docs/app/hub-app.css
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Build Apps Script UI assets"
            git push
          fi
